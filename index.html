<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Animals of the World – a picture map of animals for small kids, in English and Czech." />
    <title>Animals of the World</title>
  </head>
  <body>
    <div id="root">
      <p class="boot-msg">🐾</p>
    </div>
    <script>
      // Safety net for old browsers: if the app can't start, show a message instead of an empty screen.
      // (Plain ES5 on purpose – this must run everywhere.)
      (function () {
        var shown = false
        function fail(msg) {
          var root = document.getElementById('root')
          if (shown || !root || root.querySelector('main, .loading')) return
          shown = true
          root.innerHTML =
            '<div class="boot-error"><p>😿 Tento prohlížeč aplikaci nezvládá. Zkuste prosím aktualizovat prohlížeč nebo použít Chrome.</p>' +
            '<p>😿 This browser cannot run the app. Please update the browser or use Chrome.</p>' +
            '<small>' + String(msg).replace(/</g, '&lt;') + '<br>' + navigator.userAgent.replace(/</g, '&lt;') + '</small></div>'
        }
        window.addEventListener('error', function (e) { fail(e.message || e.type) })
        window.addEventListener('unhandledrejection', function (e) { fail((e.reason && e.reason.message) || e.reason) })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.querySelector('main, .loading')) fail('Timeout – ' + navigator.userAgent)
        }, 15000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
